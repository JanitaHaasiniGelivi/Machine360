services:
  # Backend API on Render
  - type: web
    name: machinemind360-backend
    env: python
    region: oregon
    plan: standard
    buildCommand: "cd backend && pip install -r requirements.txt && python ../ml/scripts/train.py"
    startCommand: "cd backend && alembic upgrade head && python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.2
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: machinemind360-db
          property: connectionString
      - key: CORS_ORIGINS
        value: "https://machinemind360.vercel.app,http://localhost:5173"
      - key: ML_ARTIFACTS_DIR
        value: "/opt/render/project/src/ml/artifacts"

databases:
  # Managed PostgreSQL on Render
  - name: machinemind360-db
    region: oregon
    plan: standard
    databaseName: machinemind360
    user: machinemind_admin
